[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vacca-vision"
version = "0.1.0"
description = "Framework-neutral bovine image aptitude classification core"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["Pillow"]

[project.optional-dependencies]
yolo = ["ultralytics==8.4.115"]
bcs = [
  "PyYAML>=6.0",
  "requests>=2.34.2,<3",
  "torch>=2.6",
  "torchvision>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]
