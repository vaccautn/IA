[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vacca-vision"
version = "0.1.0"
description = "Framework-neutral bovine image aptitude classification core"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["Pillow"]

[project.optional-dependencies]
yolo = ["ultralytics==8.4.115"]
api = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "python-multipart==0.0.32",
]

[tool.setuptools.packages.find]
where = ["src"]
