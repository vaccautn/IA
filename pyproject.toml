[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vacca-vision"
version = "0.1.0"
description = "Bovine detection API and integer ordinal BCS training and serving"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["Pillow"]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.15.20"]
api = ["fastapi", "python-multipart", "uvicorn"]
yolo = ["ultralytics==8.4.115"]
bcs = [
  "PyYAML>=6.0",
  "requests>=2.34.2,<3",
  "torch>=2.6",
  "torchvision>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
