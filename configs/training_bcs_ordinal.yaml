# VACCA Phase 2 — local ordinal BCS training; 3.25/3.5→3 and 3.75/4.0/4.25→4.
# The model remains five-class (1..5); missing 1, 2, and 5 are not validated.
data_root: data/bcs-local-integer-v1
output_dir: outputs/bcs-ordinal-local-integer-v1
allow_partial_class_coverage: true
epochs: 30
batch_size: 64
lr: 0.0003
weight_decay: 0.0001
optimizer: AdamW
lr_schedule: cosine
warmup_epochs: 2
patience: 8
num_workers: 0 # Keep randomized training transforms in the main process.
val_num_workers: 2 # Validation is deterministic and may use independent workers.
val_seed: 43 # Independent DataLoader worker/startup seed; not training RNG.
progress_every_batches: 50 # Live training progress cadence; final batch is always shown.
imgsz: 224
device: auto
seed: 42
